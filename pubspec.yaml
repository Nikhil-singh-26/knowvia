name: know_via
description: "Turns your scattered notes into an intelligent, interconnected map of your knowledge"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  flutter_animate: ^4.5.2
  iconsax: ^0.0.8
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0

  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0

  drift: ^2.34.3
  path_provider: ^2.1.6
  flutter_secure_storage: ^11.0.0
  uuid: ^4.6.0

  dio: ^5.11.0
  connectivity_plus: ^7.3.1

  flutter_markdown_plus: ^1.0.12
  intl: ^0.20.3

  image_picker: ^1.2.3
  image_cropper: ^12.2.1
  cached_network_image: ^3.4.1
  permission_handler: ^13.0.1

  record: ^7.1.1
  just_audio: ^0.10.6
  speech_to_text: ^7.4.0

  flutter_local_notifications: ^22.3.0

  share_plus: ^13.3.0
  app_links: ^7.2.1

  salomon_bottom_bar: ^3.3.2

  json_annotation: ^4.12.0
  path: ^1.9.1
  shared_preferences: ^2.5.5
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4
  file_picker: ^12.0.0
  google_generative_ai: ^0.4.7
  flutter_dotenv: ^6.0.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  json_serializable: ^6.14.1
  build_runner: ^2.15.1
  drift_dev: ^2.34.0

flutter:
  uses-material-design: true

  assets:
    - .env

flutter_native_splash:
  color: "#E5E7EB"
  image: assets/images/know_via_logo.jpeg

  color_dark: "#E5E7EB"
  image_dark: assets/images/know_via_logo.jpeg

  android: true
  ios: true
  web: true

  android_12:
    color: "#E5E7EB"
    color_dark: "#E5E7EB"
    image: assets/images/know_via_logo.jpeg
    image_dark: assets/images/know_via_logo.jpeg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/know_via_logo.jpeg"
  web:
    generate: true
    image_path: "assets/images/know_via_logo.jpeg"
